<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVENTFORCE | Event Management</title>
<style>
:root{--navy:#172554;--blue:#3157d5;--bg:#f4f7fc;--text:#1d2945;--muted:#71809d;--line:#e6ebf4;--white:#fff;--green:#15966a;--orange:#e89a2d;--red:#d94b57}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,Segoe UI,Arial,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:600}.primary{background:var(--blue);color:#fff}.secondary{background:#eef2ff;color:#3157d5}.danger{background:#fff0f0;color:var(--red)}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#111d42;color:#dce5ff;padding:24px 15px;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 28px;font-size:19px;font-weight:800;letter-spacing:.5px;color:#fff}.logo{background:#3157d5;border-radius:11px;width:36px;height:36px;display:grid;place-items:center;font-size:18px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#8292bf;padding:12px 13px}.nav{display:flex;gap:12px;align-items:center;width:100%;background:transparent;color:#c4cfea;text-align:left;padding:12px 13px;margin:2px 0;border-radius:9px}.nav .ico{width:20px;text-align:center;font-size:16px}.nav.active,.nav:hover{background:#263a78;color:#fff}.side-foot{margin:35px 12px 0;color:#8292bf;font-size:11px;line-height:1.6}.main{flex:1;min-width:0}.topbar{height:75px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.crumb{color:var(--muted)}.user{display:flex;align-items:center;gap:10px;font-weight:600}.avatar{width:34px;height:34px;border-radius:50%;background:#e7edff;color:#3157d5;display:grid;place-items:center;font-weight:800}.content{padding:30px 32px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:23px}.head h1{margin:0 0 6px;font-size:25px}.sub{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-bottom:22px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:38px;height:38px;border-radius:11px;background:#edf2ff;color:#3157d5;display:grid;place-items:center;font-size:18px}.stat-num{font-size:28px;font-weight:800;margin:12px 0 3px}.stat-note{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:18px}.panel h3{margin:0 0 5px;font-size:15px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.bars{display:flex;align-items:end;gap:15px;height:170px;padding:8px 7px 0;border-bottom:1px solid var(--line)}.barcol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;color:var(--muted);font-size:11px}.bar{width:min(34px,75%);border-radius:6px 6px 0 0;background:linear-gradient(180deg,#6b8cff,#3157d5);min-height:4px}.legend{display:flex;gap:15px;margin-top:13px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3157d5;margin-right:5px}.dot.orange{background:#e89a2d}.dot.green{background:#15966a}.status-list{display:grid;gap:17px}.status-row{display:grid;grid-template-columns:90px 1fr 28px;align-items:center;gap:9px;color:var(--muted);font-size:12px}.track{height:8px;background:#edf0f7;border-radius:9px;overflow:hidden}.fill{height:100%;background:#3157d5;border-radius:9px}.fill.orange{background:#e89a2d}.fill.green{background:#15966a}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:13px}.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;min-width:210px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#8ba3ff;outline:2px solid #e5eaff}table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;background:#f9faff;color:#8490a8;font-size:11px;letter-spacing:.4px;font-weight:700}th,td{padding:14px 16px;border-bottom:1px solid #edf0f6}td{font-size:12px}tr:last-child td{border-bottom:0}.name{font-weight:700;font-size:13px}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:700;background:#edf2ff;color:#3157d5}.pill.Completed,.pill.Approved,.pill.Available{background:#e5f7ef;color:#16845e}.pill.Pending,.pill.Planned,.pill.UnderReview{background:#fff4df;color:#a96c12}.pill.Cancelled,.pill.Rejected,.pill.Unavailable{background:#fff0f0;color:#c23f4b}.actions{display:flex;gap:6px}.tiny{padding:6px 8px;font-size:11px;background:#f1f4fb;color:#53627f}.empty{text-align:center;padding:36px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#687794;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}.field textarea{min-height:80px;resize:vertical}.modal-bg{position:fixed;inset:0;background:#0c173b88;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-bg.show{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:23px;box-shadow:0 20px 70px #0c173b44}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:18px}.close{background:#f2f4f9;color:#65718a;padding:6px 10px}.modal-actions{display:flex;justify-content:end;gap:9px;margin-top:20px}.notice{font-size:11px;color:var(--muted);margin-top:12px}.report-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.report-card{padding:18px;border:1px solid var(--line);border-radius:12px;background:#fff}.report-card strong{display:block;font-size:20px;margin:8px 0}.mobile-menu{display:none;background:transparent;font-size:20px;padding:4px;color:var(--text)}
@media(max-width:900px){.sidebar{width:205px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:22px 18px}.topbar{padding:0 18px}}
@media(max-width:620px){.sidebar{display:none;position:fixed;z-index:4;inset:0 auto 0 0;width:245px}.sidebar.open{display:block}.mobile-menu{display:block}.topbar{height:62px}.content{padding:18px 12px}.stats{gap:9px}.stat{padding:13px}.stat-num{font-size:23px}.head{align-items:flex-start}.head h1{font-size:21px}.form-grid,.report-cards{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">✦</div>EVENTFORCE</div><div class="nav-label">WORKSPACE</div>
<button class="nav active" data-page="Dashboard"><span class="ico">▦</span>Dashboard</button>
<button class="nav" data-page="Events"><span class="ico">▣</span>Events</button><button class="nav" data-page="Clients"><span class="ico">♙</span>Clients</button><button class="nav" data-page="Vendors"><span class="ico">♧</span>Vendors</button><button class="nav" data-page="Venues"><span class="ico">⌂</span>Venues</button><button class="nav" data-page="Coordination"><span class="ico">⇄</span>Event–Vendor</button><div class="nav-label">OPERATIONS</div><button class="nav" data-page="Approvals"><span class="ico">✓</span>Approvals & Flows</button><button class="nav" data-page="Feedback"><span class="ico">☆</span>Feedback</button><button class="nav" data-page="Reports"><span class="ico">▤</span>Reports</button><div class="side-foot">Centralized event administration<br>Demo workspace · Local browser data</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="menu">☰</button><span class="crumb">Workspace / <b id="crumb">Dashboard</b></span></div><div class="user"><div class="avatar">EF</div><span>Event Admin</span></div></header><section class="content" id="content"></section></main></div>
<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2 id="modal-title">Add Record</h2><button class="close" id="close">✕</button></div><form id="record-form"><div class="form-grid" id="form-fields"></div><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary" type="submit">Save Record</button></div></form></div></div>
<script>
const seed={
Events:[{id:1,name:"Tech Summit 2026",type:"Conference",date:"2026-10-18",client:"NovaTech",venue:"Grand Hall",budget:250000,status:"Planned"},{id:2,name:"Annual Awards Night",type:"Award Ceremony",date:"2026-10-25",client:"BrightWorks",venue:"Skyline Convention",budget:180000,status:"Approved"},{id:3,name:"Product Launch",type:"Corporate",date:"2026-11-04",client:"Aster Labs",venue:"Innovation Center",budget:320000,status:"Pending"},{id:4,name:"Wedding Reception",type:"Wedding",date:"2026-11-12",client:"Kavya & Arun",venue:"Garden Palace",budget:450000,status:"Completed"}],
Clients:[{id:1,name:"NovaTech",email:"hello@novatech.in",phone:"+91 98765 43210",city:"Chennai",country:"India",address:"T. Nagar, Chennai"},{id:2,name:"BrightWorks",email:"contact@brightworks.in",phone:"+91 98765 12345",city:"Coimbatore",country:"India",address:"RS Puram, Coimbatore"},{id:3,name:"Aster Labs",email:"admin@asterlabs.in",phone:"+91 91234 56789",city:"Bengaluru",country:"India",address:"Whitefield, Bengaluru"},{id:4,name:"Kavya & Arun",email:"kavya@example.com",phone:"+91 90000 11122",city:"Karur",country:"India",address:"Karur, Tamil Nadu"}],
Vendors:[{id:1,name:"PixelCraft Media",service:"Photography",email:"team@pixelcraft.in",phone:"+91 90000 22211",rating:4.8,status:"Available"},{id:2,name:"SoundWave Pro",service:"Audio & Lighting",email:"info@soundwave.in",phone:"+91 90000 22212",rating:4.6,status:"Available"},{id:3,name:"Flora Events",service:"Decoration",email:"flora@events.in",phone:"+91 90000 22213",rating:4.5,status:"Unavailable"}],
Venues:[{id:1,name:"Grand Hall",address:"Anna Salai, Chennai",capacity:800,hall:"Main Hall",availability:"Available"},{id:2,name:"Skyline Convention",address:"Avinashi Road, Coimbatore",capacity:500,hall:"Sky Ballroom",availability:"Available"},{id:3,name:"Innovation Center",address:"Whitefield, Bengaluru",capacity:350,hall:"Auditorium",availability:"Unavailable"},{id:4,name:"Garden Palace",address:"Karur, Tamil Nadu",capacity:600,hall:"Garden Pavilion",availability:"Available"}],
Coordination:[{id:1,event:"Tech Summit 2026",vendor:"PixelCraft Media",service:"Photography",status:"Assigned"},{id:2,event:"Tech Summit 2026",vendor:"SoundWave Pro",service:"Audio & Lighting",status:"Assigned"},{id:3,event:"Annual Awards Night",vendor:"Flora Events",service:"Decoration",status:"Assigned"}],
Approvals:[{id:1,event:"Tech Summit 2026",request:"Event budget approval",requestedBy:"Event Admin",date:"2026-09-28",status:"Pending"},{id:2,event:"Annual Awards Night",request:"Venue confirmation",requestedBy:"Event Admin",date:"2026-09-26",status:"Approved"},{id:3,event:"Product Launch",request:"Vendor assignment",requestedBy:"Event Admin",date:"2026-09-29",status:"Pending"}],
Feedback:[{id:1,event:"Wedding Reception",client:"Kavya & Arun",rating:5,comments:"Excellent coordination and decoration.",date:"2026-09-20"},{id:2,event:"Annual Awards Night",client:"BrightWorks",rating:4,comments:"Well managed event.",date:"2026-09-22"}]
};
let db={};const pages=["Dashboard","Events","Clients","Vendors","Venues","Coordination","Approvals","Feedback","Reports"];let current="Dashboard",editing=null;
function init(){pages.filter(p=>p!=="Dashboard"&&p!=="Reports").forEach(k=>{try{db[k]=JSON.parse(localStorage.getItem("ef_"+k))||seed[k].map(x=>({...x}))}catch{db[k]=seed[k].map(x=>({...x}))}});render()}
function save(k){localStorage.setItem("ef_"+k,JSON.stringify(db[k]))}
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function pill(s){return `<span class="pill ${esc(s).replace(/\s/g,'')}">${esc(s)}</span>`}
function setPage(p){current=p;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("crumb").textContent=p;$("sidebar").classList.remove("open");render()}
function render(){if(current==="Dashboard")dashboard();else if(current==="Reports")reports();else tablePage(current)}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>setPage(b.dataset.page));$("menu").onclick=()=>$("sidebar").classList.toggle("open");
function head(title,sub,button=""){return `<div class="head"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${button}</div>`}
function dashboard(){let ev=db.Events,active=ev.filter(e=>e.status!=="Completed"&&e.status!=="Cancelled").length,avg=db.Feedback.length?(db.Feedback.reduce((a,x)=>a+Number(x.rating),0)/db.Feedback.length).toFixed(1):"—";let types={};ev.forEach(e=>types[e.type]=(types[e.type]||0)+1);let max=Math.max(1,...Object.values(types));let status=["Planned","Pending","Approved","Completed"];let total=Math.max(1,ev.length);$("content").innerHTML=head("Dashboard","Welcome back! Here's what's happening with your events.")+`<div class="stats">${[["Total Events",ev.length,"▣"],["Total Clients",db.Clients.length,"♙"],["Total Vendors",db.Vendors.length,"♧"],["Total Venues",db.Venues.length,"⌂"]].map(x=>`<div class="stat"><div class="stat-top"><span>${x[0]}</span><span class="stat-icon">${x[2]}</span></div><div class="stat-num">${x[1]}</div><div class="stat-note">Records in workspace</div></div>`).join("")}</div><div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Events by Type</h3><div class="sub">Distribution of event records</div></div><span class="muted">◷</span></div><div class="bars">${Object.entries(types).map(([k,v])=>`<div class="barcol"><b>${v}</b><div class="bar" style="height:${Math.max(5,v/max*115)}px"></div><span>${esc(k)}</span></div>`).join("")||'<span class="muted">No events yet</span>'}</div><div class="legend"><span><i class="dot"></i>Events</span></div></div><div class="panel"><div class="panel-head"><div><h3>Event Lifecycle</h3><div class="sub">Current status overview</div></div></div><div class="status-list">${status.map((s,i)=>{let n=ev.filter(e=>e.status===s).length;return `<div class="status-row"><span>${s}</span><div class="track"><div class="fill ${i===1?"orange":i===3?"green":""}" style="width:${n/total*100}%"></div></div><b>${n}</b></div>`}).join("")}</div><div class="legend"><span><i class="dot"></i>Planned / Approved</span><span><i class="dot orange"></i>Pending</span><span><i class="dot green"></i>Completed</span></div></div></div><div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Upcoming Events</h3><div class="sub">Scheduled event records</div></div><button class="secondary" onclick="setPage('Events')">View all →</button></div>${ev.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(e=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)"><div><div class="name">${esc(e.name)}</div><div class="muted" style="margin-top:5px">${esc(e.date)} · ${esc(e.venue)}</div></div>${pill(e.status)}</div>`).join("")||'<div class="empty">No events available</div>'}</div><div class="panel"><div class="panel-head"><div><h3>Client Feedback</h3><div class="sub">Average event rating</div></div><span class="stat-icon">☆</span></div><div class="stat-num">${avg} <span style="font-size:15px;color:#e5a12a">★</span></div><div class="sub">${db.Feedback.length} feedback entries recorded</div><div style="margin-top:20px"><button class="secondary" onclick="setPage('Feedback')">Review feedback →</button></div></div></div>`}
const config={
Events:{title:"Event Management",sub:"Create, organize and track all your events.",fields:[["name","Event Name","text"],["type","Event Type","select",["Conference","Corporate","Wedding","Award Ceremony","Workshop","Other"]],["date","Event Date","date"],["client","Client","select",()=>db.Clients.map(x=>x.name)],["venue","Venue","select",()=>db.Venues.map(x=>x.name)],["budget","Budget (₹)","number"],["status","Status","select",["Planned","Pending","Approved","Completed","Cancelled"]]]},
Clients:{title:"Client Directory",sub:"Maintain client identity and contact information.",fields:[["name","Client Name","text"],["email","Email","email"],["phone","Phone","text"],["city","City","text"],["country","Country","text"],["address","Address","text"]]},
Vendors:{title:"Vendor Management",sub:"Manage service providers and their details.",fields:[["name","Vendor Name","text"],["service","Service Type","text"],["email","Email","email"],["phone","Phone","text"],["rating","Rating (0–5)","number"],["status","Status","select",["Available","Unavailable"]]]},
Venues:{title:"Venue Management",sub:"Manage halls, capacity and venue availability.",fields:[["name","Venue Name","text"],["address","Address","text"],["capacity","Capacity","number"],["hall","Hall Details","text"],["availability","Availability","select",["Available","Unavailable"]]]},
Coordination:{title:"Event–Vendor Coordination",sub:"Assign vendors and services to events.",fields:[["event","Event","select",()=>db.Events.map(x=>x.name)],["vendor","Vendor","select",()=>db.Vendors.map(x=>x.name)],["service","Service","text"],["status","Assignment Status","select",["Assigned","Requested","Completed"]]]},
Approvals:{title:"Approvals & Flows",sub:"Track event requests and approval status.",fields:[["event","Event","select",()=>db.Events.map(x=>x.name)],["request","Request","text"],["requestedBy","Requested By","text"],["date","Request Date","date"],["status","Status","select",["Pending","Approved","Rejected"]]]},
Feedback:{title:"Client Feedback",sub:"Capture ratings and comments after events.",fields:[["event","Event","select",()=>db.Events.map(x=>x.name)],["client","Client","select",()=>db.Clients.map(x=>x.name)],["rating","Rating (1–5)","number"],["comments","Comments","textarea"],["date","Feedback Date","date"]]}
};
const cols={Events:[["name","Event Name"],["type","Type"],["date","Date"],["client","Client"],["venue","Venue"],["budget","Budget"],["status","Status"]],Clients:[["name","Client Name"],["email","Email"],["phone","Phone"],["city","City"],["country","Country"]],Vendors:[["name","Vendor"],["service","Service"],["email","Email"],["phone","Phone"],["rating","Rating"],["status","Status"]],Venues:[["name","Venue"],["address","Address"],["capacity","Capacity"],["hall","Hall"],["availability","Availability"]],Coordination:[["event","Event"],["vendor","Vendor"],["service","Service"],["status","Status"]],Approvals:[["event","Event"],["request","Request"],["requestedBy","Requested By"],["date","Date"],["status","Status"]],Feedback:[["event","Event"],["client","Client"],["rating","Rating"],["comments","Comments"],["date","Date"]]};
function tablePage(p){let c=config[p],rows=db[p],btn=`<button class="primary" onclick="openModal('${p}')">＋ Add ${p==="Coordination"?"Assignment":p.slice(0,-1)||p}</button>`;$("content").innerHTML=head(c.title,c.sub,btn)+`<div class="toolbar"><input class="search" id="search" placeholder="⌕  Search ${p.toLowerCase()}..." oninput="filterRows()"><span class="muted" id="count">${rows.length} records</span></div><div class="table-wrap"><table><thead><tr>${cols[p].map(x=>`<th>${x[1].toUpperCase()}</th>`).join("")}<th>ACTIONS</th></tr></thead><tbody id="tbody">${rowsHtml(p,rows)}</tbody></table></div><div class="notice">Demo data is stored in this browser using local storage.</div>`}
function rowsHtml(p,rows){if(!rows.length)return `<tr><td colspan="${cols[p].length+1}" class="empty">No records found. Add a record to get started.</td></tr>`;return rows.map(x=>`<tr>${cols[p].map(([k])=>`<td>${k==="status"||k==="availability"?pill(x[k]):k==="budget"?money(x[k]):k==="rating"&&p==="Feedback"?`${"★".repeat(Math.max(0,Number(x[k])||0))} <span class="muted">${x[k]}/5</span>`:k==="rating"?`${esc(x[k])} ★`:esc(x[k])}</td>`).join("")}<td><div class="actions"><button class="tiny" onclick="openModal('${p}',${x.id})">Edit</button><button class="tiny" onclick="removeRecord('${p}',${x.id})">Delete</button>${p==="Approvals"&&x.status==="Pending"?`<button class="tiny" onclick="approve(${x.id},'Approved')">✓</button><button class="tiny" onclick="approve(${x.id},'Rejected')">✕</button>`:""}</div></td></tr>`).join("")}
function filterRows(){let p=current,q=$("search").value.toLowerCase(),rows=db[p].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q)));$("tbody").innerHTML=rowsHtml(p,rows);$("count").textContent=rows.length+" records"}
function openModal(p,id=null){editing=id;let c=config[p],item=id?db[p].find(x=>x.id===id):{};$("modal-title").textContent=(id?"Edit ":"Add ")+ (p==="Coordination"?"Assignment":p==="Events"?"Event":p.slice(0,-1));$("form-fields").innerHTML=c.fields.map(([key,label,type,opts])=>{let val=item[key]??(key==="date"?new Date().toISOString().slice(0,10):"");if(type==="select"){let choices=typeof opts==="function"?opts():opts;return `<div class="field"><label>${label}</label><select name="${key}" required><option value="">Select ${label}</option>${choices.map(v=>`<option ${String(v)===String(val)?"selected":""} value="${esc(v)}">${esc(v)}</option>`).join("")}</select></div>`}if(type==="textarea")return `<div class="field full"><label>${label}</label><textarea name="${key}" required>${esc(val)}</textarea></div>`;return `<div class="field ${key==="address"?"full":""}"><label>${label}</label><input name="${key}" type="${type}" value="${esc(val)}" ${["budget","capacity","rating"].includes(key)?'min="0"':''} ${key==="rating"?'max="5" step="0.1"':""} required></div>`}).join("");$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")} $("close").onclick=$("cancel").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};
$("record-form").onsubmit=e=>{e.preventDefault();let p=current,data=Object.fromEntries(new FormData(e.target).entries());config[p].fields.forEach(([k,,t])=>{if(t==="number")data[k]=Number(data[k])});if(editing){let i=db[p].findIndex(x=>x.id===editing);db[p][i]={...db[p][i],...data}}else data.id=Math.max(0,...db[p].map(x=>x.id))+1,db[p].push(data);save(p);closeModal();render()};
function removeRecord(p,id){if(!confirm("Delete this record?"))return;db[p]=db[p].filter(x=>x.id!==id);save(p);render()}
function approve(id,status){let x=db.Approvals.find(a=>a.id===id);if(x){x.status=status;save("Approvals");render()}}
function reports(){let ev=db.Events,up=ev.filter(e=>e.status!=="Completed"&&e.status!=="Cancelled"),budget=ev.reduce((a,e)=>a+Number(e.budget||0),0);$("content").innerHTML=head("Reports & Analytics","Operational summaries from your event records.",`<button class="secondary" onclick="window.print()">⇩ Print Report</button>`)+`<div class="report-cards"><div class="report-card"><span class="muted">Upcoming Events</span><strong>${up.length}</strong><span class="muted">Planned, pending or approved</span></div><div class="report-card"><span class="muted">Total Event Budget</span><strong>${money(budget)}</strong><span class="muted">Across all event records</span></div><div class="report-card"><span class="muted">Available Venues</span><strong>${db.Venues.filter(v=>v.availability==="Available").length}</strong><span class="muted">Currently marked available</span></div><div class="report-card"><span class="muted">Available Vendors</span><strong>${db.Vendors.filter(v=>v.status==="Available").length}</strong><span class="muted">Currently marked available</span></div><div class="report-card"><span class="muted">Pending Approvals</span><strong>${db.Approvals.filter(a=>a.status==="Pending").length}</strong><span class="muted">Awaiting review</span></div><div class="report-card"><span class="muted">Average Feedback</span><strong>${db.Feedback.length?(db.Feedback.reduce((a,x)=>a+Number(x.rating),0)/db.Feedback.length).toFixed(1)+" / 5":"—"}</strong><span class="muted">${db.Feedback.length} feedback entries</span></div></div><div class="panel" style="margin-top:20px"><div class="panel-head"><div><h3>Events by Status</h3><div class="sub">Summary of maintained event records</div></div></div><div class="table-wrap" style="border:0"><table><thead><tr><th>Status</th><th>Number of Events</th><th>Share</th></tr></thead><tbody>${["Planned","Pending","Approved","Completed","Cancelled"].map(s=>{let n=ev.filter(e=>e.status===s).length;return `<tr><td>${pill(s)}</td><td>${n}</td><td>${ev.length?(n/ev.length*100).toFixed(0):0}%</td></tr>`}).join("")}</tbody></table></div></div>`}
init();
</script></body></html>
